name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Einmal pro Woche, damit neu veröffentlichte Regeln auch auf unverändertem
    # Code greifen. Montags früh, damit ein Treffer die Woche über auffällt.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    name: Statische Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # Nur dieser Job darf Ergebnisse in den Sicherheitsbereich schreiben.
      security-events: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
