name: Wachhund

# Prüft täglich die veröffentlichte Seite von außen: Erreichbarkeit,
# Indexierungsfreigabe, Bilddateien, DNS, Mailversand und Zertifikat.
# Schlägt etwas an, wird dieser Lauf rot und GitHub schickt dem Eigentümer
# eine Mail. Niemand muss also regelmäßig nachsehen.
#
# Zwei Dinge, die man dazu wissen muss:
#
# 1. Was genau geprüft wird und warum, steht im Kopf von
#    `scripts/pruefe-live.mjs` – nicht hier.
# 2. GitHub schaltet geplante Läufe nach 60 Tagen ohne Aktivität im
#    Repository ab und schickt vorher eine Mail. Die wöchentlichen
#    Dependabot-Zusammenführungen gelten als Aktivität und halten den
#    Wachhund damit von allein wach. Falls diese Kette doch einmal reißt,
#    fängt der Totmannschalter am Ende dieses Laufs es auf: siehe
#    ADR 0011.

on:
  schedule:
    # 06:30 UTC, also 07:30 oder 08:30 Ortszeit – eine etwaige Mail liegt
    # damit vor dem Frühstück im Postfach.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wachhund
  cancel-in-progress: false

jobs:
  pruefen:
    name: Veröffentlichte Seite prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Ping-Adresse eines Checks bei healthchecks.io, als Repository-Secret
      # `LEBENSZEICHEN_URL`. Ist es nicht gesetzt, bleibt die Variable leer
      # und der letzte Schritt überspringt sich – der Wachhund läuft dann
      # genauso, nur ohne Totmannschalter.
      LEBENSZEICHEN: ${{ secrets.LEBENSZEICHEN_URL }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Kein `npm ci`: das Skript nutzt nur fetch, node:dns und node:tls.
      # Der Lauf braucht damit keine Abhängigkeiten und keine Minute.
      - name: Live-Prüfung
        id: pruefung
        run: node scripts/pruefe-live.mjs

      # Totmannschalter. Ein Wächter, dessen Schweigen „alles in Ordnung“
      # bedeutet, kann seinen eigenen Tod nicht melden: ein Lauf, der nie
      # startet, sieht genauso aus wie ein grüner Tag. Darum meldet sich
      # dieser Lauf nach außen, und healthchecks.io schlägt Alarm, wenn die
      # Meldung ausbleibt. Begründung: ADR 0011.
      #
      # Der Ping darf den Lauf nicht rot machen – eine Störung bei
      # healthchecks.io ist kein Problem dieser Seite. Kommt er dauerhaft
      # nicht an, meldet healthchecks.io das von allein.
      - name: Lebenszeichen senden
        if: ${{ !cancelled() && env.LEBENSZEICHEN != '' }}
        run: |
          ziel="$LEBENSZEICHEN"
          if [ "${{ steps.pruefung.outcome }}" != "success" ]; then
            ziel="$LEBENSZEICHEN/fail"
          fi
          curl --fail --silent --show-error --max-time 10 --retry 3 "$ziel" || true
